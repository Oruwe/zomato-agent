# Declarative contract for this agent.
#
# Not documentation that drifts: tests/test_manifest.py asserts every value below
# against the code that enforces it -- the tool allowlist in app/security/policy.py,
# the caps in app/config.py, the settlement ladder in app/payments/settlement.py, and
# the deployed values in render.yaml. Change the code without changing this file and
# CI fails, which is the only way a manifest stays true.
#
# Holds no secrets. Credentials are environment variables, valued only in deployment.

spec_version: 0.1.0
name: zomato-wallet-order
description: >-
  An autonomous agent that monitors a schedule and orders food using the Zomato MCP
  and internal wallet balance.

# --- tools -----------------------------------------------------------------------
#
# The planner may name these and nothing else. An unknown tool name is denied outright,
# which neutralises "call the payout tool" regardless of phrasing.
tools:
  - name: get_saved_addresses
    server: zomato
    mutating: false
  - name: read_schedule
    server: calendar
    mutating: false
  - name: search_restaurants
    server: zomato
    mutating: false
  - name: get_menu
    server: zomato
    mutating: false
  - name: recall_preferences
    server: local
    mutating: false
  - name: create_cart
    server: zomato
    mutating: true
  - name: checkout
    server: zomato
    mutating: true

# --- money -----------------------------------------------------------------------
#
# Zomato is the merchant of record: it collects from the user directly, and its MCP
# accepts only the two settlement types below. The wallet authorises spend; it does not
# move money.
money:
  unit: paise                   # integer minor units everywhere; never float rupees
  merchant_of_record: zomato
  settlement_types: [upi, cash_on_delivery]
  default_settlement: upi
  agent_debits_rail: false
  caps_inr:
    per_order: 1000
    daily: 1500
    # NPCI's UPI Circle caps full delegation to a secondary user at Rs 15,000/month.
    # Setting this higher turns a clear refusal into a rail decline.
    monthly: 15000
    human_approval_above: 800
  semantics: reserve -> commit | release, journalled with fsync before the call returns

  # The priority is a payment nobody has to touch. Zomato applies a user's Zomato Money
  # during a `upi` checkout and raises no collect request when it covers the bill. There
  # is no balance tool on the MCP, so the agent works from a declared estimate and
  # corrects it against what orders actually do.
  settlement:
    ladder: [zomato_money, cash_on_delivery, upi]
    balance: a declared estimate, corrected by outcomes; never presented as a reading
    rules:
      - balance covers the bill -> upi, expecting Zomato Money to absorb it (no human)
      - balance falls short     -> cash on delivery, placed with no approval step
      - cash not permitted      -> upi collect request, which the user approves
      - nothing permitted       -> the run is refused rather than guessing a rail
    decided_by: deterministic code; the planner's output never reaches this choice

# --- safety ----------------------------------------------------------------------
#
# Defaults are load-bearing: all three must be deliberately flipped before a rupee can
# move, which is what makes an accidental deploy harmless.
safety:
  dry_run: true
  allow_autonomous_checkout: false
  live_money_requires: [dry_run=false, allow_autonomous_checkout=true, rail!=mock]
  injection_block_threshold: 2
  # The calendar is attacker-writable (Gmail auto-creates events), so intent is read
  # from it through a closed vocabulary of food words: it may name a dish and can never
  # issue an instruction.
  intent_extraction: allowlist
  # The model is consulted at one point -- which restaurant, which dishes -- and its
  # answer is re-grounded against the real catalogue. Everything here is decided by
  # code its output does not reach.
  model_never_decides:
    - how much may be spent
    - which payment rail is used
    - whether an order needs human approval
    - which tools may be called
    - whether an order is placed at all
